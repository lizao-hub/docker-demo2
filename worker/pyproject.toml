[project]
name = "drone-worker"
version = "0.1.0"
description = "Mock YOLO worker: numpy-synthesised detections rendered onto video frames"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
]

[project.scripts]
drone-worker = "drone_worker.cli:main"

[project.optional-dependencies]
# 容器里不装系统 ffmpeg，改用这个包自带的静态 ffmpeg（含 libx264）。
# 0.6.0 是阿里云 PyPI 镜像上已有的最新版，0.7.x 镜像还没同步。
container = ["imageio-ffmpeg>=0.6,<0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drone_worker"]
